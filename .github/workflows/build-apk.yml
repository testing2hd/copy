name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange flat files into project folders
        run: |
          mkdir -p www native/java scripts
          mv -f index.html app.js style.css www/ 2>/dev/null || true
          mv -f *.java native/java/ 2>/dev/null || true
          mv -f manifest-components.xml manifest-permissions.xml native/ 2>/dev/null || true
          mv -f patch-android.js scripts/ 2>/dev/null || true
          ls -R www native scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Inject native code, manifest and Shizuku
        run: node scripts/patch-android.js

      - name: Sync web assets
        run: npx cap sync android

      - name: Restore signing key (optional)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: link-router-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
